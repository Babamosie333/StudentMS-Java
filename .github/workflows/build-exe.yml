name: Build Windows EXE

# Runs whenever you push code, or manually from the Actions tab
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR with Maven
        run: mvn -B package

      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Build .exe with jpackage
        run: |
          jpackage --input target --main-jar StudentMS-1.0.0.jar --main-class sms.Main --name StudentMS --type exe --app-version 1.0.0 --add-modules ALL-MODULE-PATH

      - name: Upload .exe as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentMS-Windows-Installer
          path: "*.exe"